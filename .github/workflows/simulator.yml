name: Simulator

on:
  push:
    branches: [main]
    paths: ['simulator/**', '.github/workflows/simulator.yml']
  pull_request:
    paths: ['simulator/**', '.github/workflows/simulator.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator/liftoff-hover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pygame
      - run: python -m unittest -v test_hover.py

  autopilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s autopilot/tests -t . -v
