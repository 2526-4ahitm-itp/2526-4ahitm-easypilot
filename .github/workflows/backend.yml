name: Backend

on:
  push:
    branches: [main]
    paths: ['webinterface/backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['webinterface/backend/**', '.github/workflows/backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webinterface/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test
