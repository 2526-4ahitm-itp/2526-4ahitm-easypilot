name: Images

on:
  push:
    branches: [main]
    paths: ['webinterface/**', '.github/workflows/images.yml']

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webinterface/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B package -DskipTests
      - name: Login ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build und Push
        run: |
          IMAGE=ghcr.io/2526-4ahitm-itp/easypilot-backend
          docker build -f src/main/docker/Dockerfile.jvm -t $IMAGE:latest -t $IMAGE:${GITHUB_SHA::7} .
          docker push --all-tags $IMAGE

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build und Push
        run: |
          IMAGE=ghcr.io/2526-4ahitm-itp/easypilot-web
          docker build -t $IMAGE:latest -t $IMAGE:${GITHUB_SHA::7} webinterface/frontend
          docker push --all-tags $IMAGE
