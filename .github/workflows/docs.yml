name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['hugo/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['hugo/**', '.github/workflows/docs.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.167.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # enableGitInfo: last-modified dates per page

      - uses: actions/setup-go@v5
        with:
          go-version-file: hugo/go.mod
          cache: false

      - name: Install Hugo extended
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url || 'https://2526-4ahitm-itp.github.io/2526-4ahitm-easypilot' }}/"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: hugo/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
