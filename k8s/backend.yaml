apiVersion: apps/v1
kind: Deployment
metadata:
  name: easypilot-backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: easypilot-backend }
  template:
    metadata:
      labels: { app: easypilot-backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/2526-4ahitm-itp/easypilot-backend:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /api/status, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 256Mi, ephemeral-storage: 100Mi }
            limits: { memory: 256Mi, ephemeral-storage: 500Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: easypilot-backend
spec:
  selector: { app: easypilot-backend }
  ports:
    - port: 8080
      targetPort: 8080
