server {
    listen 80;
    root /usr/share/nginx/html;

    # React Router: unknown paths (e.g. /model) fall back to index.html
    # Missing build assets must stay 404, not the app shell
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
